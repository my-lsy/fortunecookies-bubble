<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Fortune</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #0b0b0b;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Landscape container: fits within the screen while preserving 16:9 ratio */
    .video-wrapper {
      position: relative;
      width: 100%;
      max-width: 1100px;
      aspect-ratio: 16 / 9;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain; /* Ensures the whole landscape video is visible without cropping */
      display: block;
    }

    /* Message overlay */
    .fortune-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 50%;
      text-align: center;
      font-family: 'Cinzel', 'Georgia', serif;
      font-size: clamp(1rem, 2.2vw, 1.6rem);
      font-weight: 700;
      color: #7a1113;
      line-height: 1.4;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.5s ease;
      z-index: 5;
    }

    .fortune-text.visible {
      opacity: 0.95;
    }

    /* Fallback button if low power mode prevents autoplay */
    .play-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 12px 26px;
      background: rgba(255, 255, 255, 0.9);
      color: #111;
      border: none;
      border-radius: 25px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: none;
      z-index: 10;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body>

  <div class="video-wrapper">
    <video id="fortuneVideo" autoplay muted playsinline preload="auto">
      <source src="cookie.mp4" type="video/mp4">
      <source src="Fortune%20Cookies-Based.mp4" type="video/mp4">
      <source src="Fortune Cookies-Based.mp4" type="video/mp4">
    </video>

    <div id="fortuneText" class="fortune-text"></div>
    <button id="manualPlayBtn" class="play-btn">Tap to Play</button>
  </div>

  <script>
    const video = document.getElementById('fortuneVideo');
    const playBtn = document.getElementById('manualPlayBtn');
    const textOverlay = document.getElementById('fortuneText');

    // 1. Read message parameter (?m=Your+Message)
    const urlParams = new URLSearchParams(window.location.search);
    const customMessage = urlParams.get('m') || "Good things come to those who create.";
    textOverlay.textContent = customMessage;

    // 2. Timestamp when the paper finishes settling (in seconds)
    const REVEAL_TIMESTAMP = 2.0;

    video.addEventListener('timeupdate', () => {
      if (video.currentTime >= REVEAL_TIMESTAMP) {
        textOverlay.classList.add('visible');
      }
    });

    video.addEventListener('ended', () => {
      video.pause();
    });

    // 3. Autoplay safeguard
    function triggerPlayback() {
      const playPromise = video.play();
      if (playPromise !== undefined) {
        playPromise.catch(() => {
          playBtn.style.display = 'block';
        });
      }
    }

    playBtn.addEventListener('click', () => {
      playBtn.style.display = 'none';
      video.play();
    });

    window.addEventListener('DOMContentLoaded', triggerPlayback);
  </script>
</body>
</html>
