<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Your Fortune</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #0b0b0b;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .video-wrapper {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 480px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    /* Fallback play button if a phone's low-power mode blocks autoplay */
    .play-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 14px 28px;
      background: rgba(255, 255, 255, 0.9);
      color: #111;
      border: none;
      border-radius: 30px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: none;
      z-index: 10;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }
    /* Dynamic message overlay on top of the blank slip */
    .fortune-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 65%;
      text-align: center;
      font-family: 'Cinzel', 'Georgia', serif;
      font-size: 1.1rem;
      font-weight: 700;
      color: #7a1113;
      line-height: 1.4;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.5s ease;
      z-index: 5;
    }
    .fortune-text.visible {
      opacity: 0.95;
    }
    /* Error notice if the file is missing */
    .error-msg {
      color: #ff6b6b;
      text-align: center;
      padding: 20px;
      display: none;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="video-wrapper">
    <video id="fortuneVideo" autoplay muted playsinline preload="auto">
      <!-- Handles both filename formats automatically -->
      <source src="cookie.mp4" type="video/mp4">
      <source src="Fortune%20Cookies-Based.mp4" type="video/mp4">
      <source src="Fortune Cookies-Based.mp4" type="video/mp4">
    </video>

    <div id="fortuneText" class="fortune-text"></div>
    <button id="manualPlayBtn" class="play-btn">Tap to Open</button>
    <div id="errorNotice" class="error-msg">Video could not be found. Please check your GitHub repository file name.</div>
  </div>

  <script>
    const video = document.getElementById('fortuneVideo');
    const playBtn = document.getElementById('manualPlayBtn');
    const textOverlay = document.getElementById('fortuneText');
    const errorNotice = document.getElementById('errorNotice');

    // 1. Read message parameter from URL (e.g. ?m=Your+Fortune)
    const urlParams = new URLSearchParams(window.location.search);
    const customMessage = urlParams.get('m') || "Good things come to those who create.";
    textOverlay.textContent = customMessage;

    // 2. Adjust this timestamp (in seconds) to match when the paper unrolls
    const REVEAL_TIMESTAMP = 2.0;

    video.addEventListener('timeupdate', () => {
      if (video.currentTime >= REVEAL_TIMESTAMP) {
        textOverlay.classList.add('visible');
      }
    });

    video.addEventListener('ended', () => {
      video.pause();
    });

    // 3. Robust autoplay handling with fallback button
    function triggerPlayback() {
      const playPromise = video.play();
      if (playPromise !== undefined) {
        playPromise.catch(() => {
          // If browser/device battery saver blocks muted autoplay, show tap button
          playBtn.style.display = 'block';
        });
      }
    }

    playBtn.addEventListener('click', () => {
      playBtn.style.display = 'none';
      video.play();
    });

    window.addEventListener('DOMContentLoaded', triggerPlayback);

    // 4. File-load diagnostic check
    video.addEventListener('error', () => {
      errorNotice.style.display = 'block';
    });
  </script>
</body>
</html>
